# Run with --config config/electron-builder.yml; paths below resolve from the project root.
appId: com.pressb.app
productName: Press B
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!config/*'
  - '!{.eslintcache,.prettierignore,CHANGELOG.md,README.md,CLAUDE.md}'
  - '!{.claude,extensions}/**'
  # The maintainer's own Press B data must never ship
  - '!{.pressb.json,.devfloat.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!tsconfig.json'
asarUnpack:
  - resources/**
# pressb:// deep links ("Create in Press B" from the IDE) — NSIS writes the
# HKCU URL-protocol registry entry at install time.
protocols:
  - name: Press B deep link
    schemes:
      - pressb
win:
  executableName: press-b
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Auto-update deferred — installers are distributed manually for now.
# When ready: switch to a GitHub provider and wire electron-updater.
